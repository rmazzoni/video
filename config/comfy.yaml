# ComfyUI backend connection settings
host: "127.0.0.1"
port: 8188

workflows_dir: "workflows"

# Default workflow used by the UI on startup
default_workflow: "vid_full_pipeline.json"

# Local ComfyUI installation (cloned via `git clone`), used to launch the server
install_dir: "F:/VID/ComfyUI"
python_executable: "F:/VID/venv/Scripts/python.exe"
