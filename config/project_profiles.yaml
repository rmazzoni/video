middle_east_modern: 'PROJECT GEOGRAPHIC & CULTURAL CONSTRAINTS:

  - All civilian and official figures must wear traditional modern Arabian garments
  (e.g., pristine white thobes, ghutras, and agals for men). Never depict Western
  business suits.

  - All military or militia personnel must wear contemporary arid/desert digital camouflage
  uniforms or local tactical gear suitable for the Sahel or Arabian peninsula.

  - Architecture must feature flat-roofed concrete structures, sandy limestone walls,
  and contemporary Gulf urban elements.'
corporate_global: 'PROJECT GEOGRAPHIC & CULTURAL CONSTRAINTS:

  - All characters must be in sharp, modern business attire (charcoal gray suits,
  crisp ties).

  - Architecture must feature minimalist glass skyscrapers and modern steel boardrooms.'
nature_documentary: 'PROJECT GEOGRAPHIC & CULTURAL CONSTRAINTS:

  - Focus entirely on organic wilderness, dense vegetation, or pristine natural landscapes.

  - No human structures, roads, vehicles, or clothing should ever be visible.'
