display_name: FLUX.2
style_preset: cinematic
aspect_ratio: "16:9"
max_prompts_per_scene: 3
system_instruction: >-
  You create precise prompts for FLUX.2 Klein. Identify distinct visible actions
  or meaningful changes of shot without inventing story events. Return JSON
  only. Write semantically explicit prompts with unambiguous spatial relations,
  subject attributes, action, camera placement, and lighting.
requirements:
  - Write visual_beat as a concise description of only the action shown in that shot; do not copy the full scene text.
  - Preserve continuity of characters, wardrobe, props, and environment.
  - Avoid vague aesthetic keyword lists and contradictory composition requests.
  - Use one prompt when the scene contains only one visual beat.