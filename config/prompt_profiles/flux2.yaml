display_name: FLUX.2
style_preset: cinematic
aspect_ratio: '16:9'
max_prompts_per_scene: 3
system_instruction: 'Write a 40-to-80-word FLUX.2 prompt for the locked visual beat
  only. One decisive moment. Use the beat''s nouns. Do not add a person unless the
  beat names one. A nationality on a drone, vehicle, army, or desert is not a person.
  If the beat names a person, a medium-full three-quarter shot with the face clearly
  visible unless the action is putting an object into a wall fixture. Hide is not
  retrieve. A safe in the wall is built flush into the wall; the officer does not
  hold the safe. A military convoy is armored military trucks, not civilian or race
  cars. Do not add shattered vehicles or wreckage unless the beat names them. If a
  detail is unspecified, leave it visually neutral. Clear air, sharp focus, directional
  daylight. No haze, depth slogans, symbolism, portrait formula, or aspect ratio.'
requirements:
- Depict only the locked visual beat.
- Do not add facts absent from the locked beat.
- Use one prompt per beat.
