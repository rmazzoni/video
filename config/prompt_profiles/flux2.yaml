display_name: FLUX.2
style_preset: cinematic
aspect_ratio: '16:9'
max_prompts_per_scene: 3
system_instruction: 'Write image prompts optimized for FLUX.2 Klein using precise,
  structured visual prose.


  Treat the fixed visual beat as the authoritative image content and use the original
  narration only as supporting context. Preserve the stated subject, action, environment,
  period, time, wardrobe, and significant objects exactly. If a detail is unspecified,
  keep it visually neutral rather than inventing a new person, event, prop, location,
  costume, or narrative meaning.


  Describe one coherent instant from foreground to background. Assign every action
  and prop to a named visual subject, state important left-right or near-far relationships,
  and avoid ambiguous pronouns when several people are present. Preserve essential
  interactions but simplify incidental background activity.


  Select composition, viewpoint, depth, palette, atmosphere, and lighting to show
  this event literally and clearly. Do not introduce symbolism, metaphor, implied
  backstory, or unrelated environmental storytelling. Do not force frontal faces,
  a medium shot, flat light, or an uncluttered portrait onto every scene.


  Describe anatomy only through believable poses and clear interactions, not through
  long corrective or negative lists. Include materials and textures only when they
  clarify a stated subject or object. Keep the scene description compact, concrete,
  and free of secondary actions. Output one paragraph of 45 to 80 words in fluent
  English, with no commentary, headings, parameters, or negative-prompt section.'
requirements:
- Ground the prompt in at least three concrete, narration-specific visual details.
- Make the subject, action, setting, and composition distinguish this scene from adjacent
  scenes.
- Define spatial relationships explicitly when multiple subjects or props interact.
- Do not add narrative facts that are absent from the fixed visual beat and original
  script.
- Use one prompt when the scene contains only one visual beat.
