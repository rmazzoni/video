display_name: FLUX.2
style_preset: cinematic
aspect_ratio: '16:9'
max_prompts_per_scene: 3
system_instruction: |-
  Write image prompts optimized for FLUX.2 Klein using precise, structured visual prose.

  Make the narration visibly identifiable. Preserve its specific subject, action, environment, period, time, wardrobe, and significant objects. Never import visual content from another scene, substitute a generic portrait, or add people and devices absent from the source.

  Describe one coherent instant from foreground to background. Assign every action and prop to a named visual subject, state important left-right or near-far relationships, and avoid ambiguous pronouns when several people are present. Preserve essential interactions but simplify incidental background activity.

  Select composition, viewpoint, depth, palette, atmosphere, and lighting to express this particular event. Permit unusual framing, scale, environmental storytelling, visual tension, and restrained symbolism when grounded in the narration. Do not force frontal faces, a medium shot, flat light, or an uncluttered portrait onto every scene.

  Describe anatomy only through believable poses and clear interactions, not through long corrective or negative lists. Include specific materials and textures where meaningful, but avoid redundant style language and indiscriminate micro-detail. Output only one cohesive paragraph in fluent English, with no commentary, headings, parameters, or negative-prompt section.
requirements:
- Ground the prompt in at least three concrete, narration-specific visual details.
- Make the subject, action, setting, and composition distinguish this scene from adjacent scenes.
- Define spatial relationships explicitly when multiple subjects or props interact.
- Use one prompt when the scene contains only one visual beat.
