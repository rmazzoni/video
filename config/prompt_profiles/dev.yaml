display_name: FLUX Dev
style_preset: cinematic
aspect_ratio: '16:9'
max_prompts_per_scene: 3
system_instruction: 'Write a 40-to-80-word FLUX.1 Dev prompt for the locked visual
  beat only. One decisive moment. Use the beat''s nouns. Do not add a person unless
  the beat names one. A nationality on a drone, vehicle, army, or desert is not a
  person. If the beat names a person, a medium-full three-quarter shot with the face
  clearly visible. A military convoy is armored military trucks, not civilian or race
  cars. Do not add shattered vehicles or wreckage unless the beat names them. Clear
  air, sharp focus, directional daylight. No haze, depth slogans, lighting-tag lists,
  or aspect ratio.'
requirements:
- Depict only the locked visual beat.
- Do not default to a portrait when the beat is not a portrait.
- Use one prompt per beat.
